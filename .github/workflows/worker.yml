name: MediaFire Chunk Fetcher

on:
  workflow_dispatch:
    inputs:
      mediafire_url:
        description: 'MediaFire File or Folder URL'
        required: true
        type: string
      job_id:
        description: 'Unique Job ID'
        required: true
        type: string

permissions:
  contents: write

jobs:
  download-and-process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Automation
        env:
          MEDIAFIRE_URL: ${{ github.event.inputs.mediafire_url }}
          JOB_ID: ${{ github.event.inputs.job_id }}
        run: python -m backend.worker

      - name: Commit and Push Chunks
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jobs/${{ github.event.inputs.job_id }}/*
          git commit -m "Auto-upload chunks for job ${{ github.event.inputs.job_id }}" || echo "No changes to commit"
          git push origin main
