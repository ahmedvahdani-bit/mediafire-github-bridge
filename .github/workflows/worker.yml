name: Universal Chunk Fetcher V2

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Download URL (MediaFire, YouTube, or Direct Link)'
        required: true
        type: string
      job_id:
        description: 'Unique Job ID'
        required: true
        type: string
      quality:
        description: 'Preferred Quality (best, 1080p, 720p, audio)'
        required: false
        default: 'best'
        type: string

permissions:
  contents: write

jobs:
  download-and-process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U -r requirements.txt
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run Backend Automation
        env:
          TARGET_URL: ${{ github.event.inputs.target_url }}
          JOB_ID: ${{ github.event.inputs.job_id }}
          QUALITY: ${{ github.event.inputs.quality }}
          GITHUB_REPO: ${{ github.repository }}
        run: python -m backend.worker

      - name: Commit and Push Chunks (Recursive & Incremental)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global http.postBuffer 1048576000
          
          JOB_DIR="data/jobs/${{ github.event.inputs.job_id }}"
          
          if [ -d "$JOB_DIR" ]; then
            find "$JOB_DIR" -type f | while read -r FILE; do
              echo "Committing and pushing $FILE..."
              git add "$FILE"
              git commit -m "Auto-upload: $(basename "$FILE")" || echo "Nothing to commit for $FILE"
              git push origin main || (echo "Push failed, retrying..." && sleep 10 && git push origin main)
            done
          else
            echo "No job directory found."
          fi
