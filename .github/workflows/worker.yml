name: MediaFire Chunk Fetcher

on:
  workflow_dispatch:
    inputs:
      mediafire_url:
        description: 'MediaFire File or Folder URL'
        required: true
        type: string
      job_id:
        description: 'Unique Job ID'
        required: true
        type: string

permissions:
  contents: write

jobs:
  download-and-process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Automation
        env:
          MEDIAFIRE_URL: ${{ github.event.inputs.mediafire_url }}
          JOB_ID: ${{ github.event.inputs.job_id }}
        run: python -m backend.worker

      - name: Commit and Push Chunks (Incremental)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Increase Git HTTP buffer size to prevent timeout errors
          git config --global http.postBuffer 1048576000
          
          JOB_DIR="data/jobs/${{ github.event.inputs.job_id }}"
          
          # Check if job directory exists
          if [ -d "$JOB_DIR" ]; then
            # Loop through each file and push individually
            for FILE in "$JOB_DIR"/*; do
              if [ -f "$FILE" ]; then
                echo "Committing and pushing $FILE..."
                git add "$FILE"
                git commit -m "Auto-upload chunk: $(basename "$FILE")" || echo "Nothing to commit for $FILE"
                
                # Push with a retry mechanism in case of temporary network glitches
                git push origin main || (echo "Push failed, retrying in 10 seconds..." && sleep 10 && git push origin main)
              fi
            done
          else
            echo "No job directory found to upload."
          fi
