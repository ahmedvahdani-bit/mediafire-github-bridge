<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Automation Bridge</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-mesh"></div>
    <main class="container glass-panel">
        <header>
            <h1>☁️ GitHub Automation Bridge</h1>
            <p>Automated Large File Chunking & Upload System</p>
        </header>

        <section class="form-group">
            <label for="patToken">GitHub PAT Token (Secret)</label>
            <input type="password" id="patToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
            
            <div class="row">
                <div class="col">
                    <label for="ghUser">GitHub Username</label>
                    <input type="text" id="ghUser" placeholder="e.g. torvalds">
                </div>
                <br>
                <div class="col">
                    <label for="ghRepo">Repository Name</label>
                    <input type="text" id="ghRepo" placeholder="e.g. mediafire-bridge">
                </div>
            </div>

            <label for="mfUrl">MediaFire URL</label>
            <input type="url" id="mfUrl" placeholder="https://www.mediafire.com/file/...">

            <button id="startBtn" class="btn-primary">Initialize Job Workflow</button>
        </section>

        <section class="status-board glass-panel-inner">
            <div class="status-header">
                <h3>Live Status</h3>
                <span id="statusBadge" class="badge idle">IDLE</span>
            </div>
            
            <div class="job-info">
                <p><strong>Job ID:</strong> <span id="currentJobId">N/A</span></p>
                <p><strong>Codeload Link:</strong> <a href="#" id="codeloadLink" target="_blank" class="disabled">Generating...</a></p>
            </div>

            <div class="console">
                <pre id="logConsole">> Waiting for system initialization...</pre>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
